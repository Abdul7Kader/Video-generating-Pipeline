<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Video Pipeline</title><link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header><div class="brand"><span class="brandmark">▶</span><div><strong>Video Pipeline</strong><small>lokal · freigabegesteuert</small></div></div><div id="health" class="health">System wird geprüft …</div></header>
  <main>
    <aside>
      <button id="new-button" class="primary full">＋ Neues Video</button>
      <div class="section-title">Aufträge</div><div id="jobs" class="jobs"></div>
    </aside>
    <section id="workspace"><div class="empty"><span>◌</span><h1>Aus einer Idee wird ein Video.</h1><p>Erstelle links einen Auftrag. Skript und Veröffentlichung bleiben immer unter deiner Kontrolle.</p></div></section>
  </main>
  <dialog id="create-dialog"><form id="create-form"><div class="dialog-head"><div><small>NEUER AUFTRAG</small><h2>Was möchtest du erzählen?</h2></div><button type="button" class="icon" data-close>×</button></div>
    <label>Thema oder Idee<textarea name="topic" rows="4" required minlength="3" placeholder="Zum Beispiel: Warum kleine Gewohnheiten große Wirkung haben"></textarea></label>
    <div class="grid3"><label>Sprache<select name="language"><option value="de">Deutsch</option><option value="en">Englisch</option></select></label><label>Länge<select name="duration_seconds"><option value="30">30 Sekunden</option><option value="60" selected>60 Sekunden</option><option value="90">90 Sekunden</option><option value="180">3 Minuten</option></select></label><label>Format<select name="aspect_ratio"><option value="9:16">9:16 · Shorts</option><option value="16:9">16:9 · YouTube</option><option value="1:1">1:1 · Quadrat</option></select></label></div>
    <div class="grid2"><label>Videoart<select name="video_type"><option value="stickman">Strichmännchen</option><option value="explainer">Erklärvideo</option><option value="social">Social Clip</option><option value="podcast">Podcast</option><option value="generated">Generiertes Video (Adapter)</option></select></label><label>Ziel<select name="target_platform"><option value="download">Download</option><option value="youtube">YouTube</option></select></label></div>
    <div class="dialog-actions"><button type="button" class="ghost" data-close>Abbrechen</button><button class="primary">Skript erzeugen</button></div>
  </form></dialog>
  <div id="toast"></div><script src="/app.js"></script>
</body></html>
