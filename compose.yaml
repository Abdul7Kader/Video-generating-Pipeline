services:
  pipeline:
    build:
      context: .
    image: local/video-pipeline:latest
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      RENDERER_DIR: /app/renderer
      RENDER_CONCURRENCY: "2"
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - pipeline_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=2G,mode=1777
      - /home/pipeline:size=128M,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pipeline_data:
