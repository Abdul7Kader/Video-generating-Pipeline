services:
  pipeline:
    build:
      context: .
    image: local/video-pipeline:latest
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      RENDERER_DIR: /app/renderer
      RENDER_CONCURRENCY: "2"
      SCRIPT_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3.5:9b-q8_0
    depends_on:
      ollama-model:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - pipeline_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=2G,mode=1777
      - /home/pipeline:size=128M,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  ollama:
    image: ollama/ollama:0.34.1
    restart: unless-stopped
    init: true
    expose:
      - "11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NOHISTORY: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "8"
    volumes:
      - ollama_models:/root/.ollama
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-model:
    image: ollama/ollama:0.34.1
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: ["OLLAMA_HOST=http://ollama:11434 ollama pull qwen3.5:9b-q8_0"]
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_models:/root/.ollama
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  pipeline_data:
  ollama_models:
